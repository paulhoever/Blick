version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true
tempfile.workspace = true
tracing.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "rayon"] }
fast_image_resize = "6.1"
rayon = "1.12"
lru = "0.18"
img-parts = "0.4"
blake3 = "1.8"
rawler = "0.8"
quick-xml = "0.42"
kamadak-exif = "0.6"

[dev-dependencies]
tempfile.workspace = true
